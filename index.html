<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição | Mostra de Tecnologia e Inovação</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="container py-3">
        <h1 class="h3 mb-3">Mostra de Tecnologia e Inovação</h1>

        <form action="#" method="post" enctype="multipart/form-data">
            <div>
                <input type="hidden" id="evento" name="evento" value="Mostra de Tecnologia e Inovação">

                <fieldset class="mb-4">
                    <legend class="h5 border-bottom pb-2">1. Identificação do participante</legend>
                    <div class="row g-3">
                        <div class="col-12 col-md-6">
                            <label for="nome" class="form-label">Nome completo</label>
                            <input type="text" class="form-control" id="nome" name="nome" required minlength="3"
                                maxlength="100" placeholder="Digite seu nome completo">
                        </div>
                        <div class="col-12 col-md-6">
                            <label for="senha" class="form-label">Senha</label>
                            <input type="password" class="form-control" id="senha" name="senha" required minlength="6"
                                placeholder="Use uma senha fictícia">
                            <div class="form-text">Não use uma senha real.</div>
                        </div>
                        <div class="col-12 col-md-6">
                            <label for="idade" class="form-label">Idade</label>
                            <input type="number" class="form-control" id="idade" name="idade" min="14" max="100" step="1"
                                required placeholder="Ex.: 20">
                        </div>
                        <div class="col-12 col-md-6">
                            <label for="cor" class="form-label">Cor preferida</label>
                            <input type="color" class="form-control form-control-color" id="cor" name="cor" value="#0d6efd">
                        </div>
                    </div>
                </fieldset>

                <fieldset class="mb-4">
                    <legend class="h5 border-bottom pb-2">2. Dados de contato</legend>
                    <div class="row g-3">
                        <div class="col-12 col-md-6">
                            <label for="email" class="form-label">E-mail</label>
                            <input type="email" class="form-control" id="email" name="email" required
                                placeholder="nome@exemplo.com">
                        </div>
                        <div class="col-12 col-md-6">
                            <label for="telefone" class="form-label">Telefone</label>
                            <input type="tel" class="form-control" id="telefone" name="telefone" required
                                pattern="\([0-9]{2}\) [0-9]{4,5}-[0-9]{4}" placeholder="(11) 99999-9999">
                        </div>
                        <div class="col-12 col-md-6">
                            <label for="site" class="form-label">Portfólio ou site</label>
                            <input type="url" class="form-control" id="site" name="site" placeholder="https://seusite.com">
                        </div>
                    </div>
                </fieldset>

                <fieldset class="mb-4">
                    <legend class="h5 border-bottom pb-2">3. Formação e experiência</legend>
                    <div class="row g-3">
                        <div class="col-12 col-md-6">
                            <label for="curso" class="form-label">Curso ou área</label>
                            <input type="text" class="form-control" id="curso" name="curso" required>
                        </div>
                        <div class="col-12 col-md-6">
                            <label for="area" class="form-label">Área do projeto</label>
                            <select class="form-select" id="area" name="area" required>
                                <option value="" selected disabled>Escolha uma área</option>
                                <option value="web">Desenvolvimento web</option>
                                <option value="dados">Dados</option>
                                <option value="robotica">Robótica</option>
                            </select>
                        </div>
                        <div class="col-12 col-md-6">
                            <label for="instituicao" class="form-label">Instituição</label>
                            <input type="search" class="form-control" id="instituicao" name="instituicao" list="instituicoes">
                            <datalist id="instituicoes">
                                <option value="Fatec">
                                <option value="Etec">
                                <option value="Outra instituição">
                            </datalist>
                        </div>
                        <div class="col-12 col-md-6">
                            <label for="curriculo" class="form-label">Currículo</label>
                            <input type="file" class="form-control" id="curriculo" name="curriculo" accept=".pdf,.doc,.docx">
                        </div>
                    </div>
                </fieldset>

                <fieldset class="mb-4">
                    <legend class="h5 border-bottom pb-2">4. Datas e disponibilidade</legend>
                    <div>
                        <label for="data" class="form-label">Escolha uma data</label>
                        <input type="date" class="form-control" id="data" name="data" required>
                    </div>
                    <div class="row g-3 mt-1">
                        <div class="col-12 col-md-6">
                            <label for="mes" class="form-label">Mês</label>
                            <input type="month" class="form-control" id="mes" name="mes">
                        </div>
                        <div class="col-12 col-md-6">
                            <label for="semana" class="form-label">Semana</label>
                            <input type="week" class="form-control" id="semana" name="semana">
                        </div>
                        <div class="col-12 col-md-6">
                            <label for="hora" class="form-label">Horário</label>
                            <input type="time" class="form-control" id="hora" name="hora">
                        </div>
                        <div class="col-12 col-md-6">
                            <label for="dataHora" class="form-label">Data e hora</label>
                            <input type="datetime-local" class="form-control" id="dataHora" name="dataHora">
                        </div>
                    </div>
                </fieldset>

                <fieldset class="mb-4">
                    <legend class="h5 border-bottom pb-2">5. Preferências</legend>
                    <div class="mb-3">
                        <span class="form-label d-block">Como você participará?</span>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" id="individual" name="participacao" value="individual" required>
                            <label class="form-check-label" for="individual">Individualmente</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" id="equipe" name="participacao" value="equipe">
                            <label class="form-check-label" for="equipe">Em equipe</label>
                        </div>
                    </div>

                    <span class="form-label d-block">Tem interesse em:</span>
                    <div class="row">
                        <div class="col-12 col-md-6">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="oficinas" name="interesses" value="oficinas">
                                <label class="form-check-label" for="oficinas">Workshops</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="palestras" name="interesses" value="palestras">
                                <label class="form-check-label" for="palestras">Palestras</label>
                            </div>
                        </div>
                        <div class="col-12 col-md-6">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="rede" name="interesses" value="rede">
                                <label class="form-check-label" for="rede">Networking</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="voluntario" name="interesses" value="voluntario">
                                <label class="form-check-label" for="voluntario">Voluntariado</label>
                            </div>
                        </div>
                    </div>
                </fieldset>

                <fieldset class="mb-4">
                    <legend class="h5 border-bottom pb-2">6. Informações sobre o projeto</legend>
                    <div class="mb-3">
                        <label for="nomeProjeto" class="form-label">Nome do projeto</label>
                        <input type="text" class="form-control" id="nomeProjeto" name="nomeProjeto" maxlength="80">
                    </div>
                    <div>
                        <label for="descricao" class="form-label">Descrição do projeto</label>
                        <textarea class="form-control" id="descricao" name="descricao" rows="4" minlength="20" maxlength="500"></textarea>
                    </div>
                    <div class="mt-3">
                        <label for="nivel" class="form-label">Nível do projeto</label>
                        <input type="range" class="form-range" id="nivel" name="nivel" min="1" max="10" step="1" value="5">
                    </div>
                </fieldset>

                <div class="d-flex gap-2 align-items-center">
                    <button type="submit" class="btn btn-primary">Enviar</button>
                    <label for="limpar" class="visually-hidden">Limpar formulário</label>
                    <input type="reset" class="btn btn-secondary" id="limpar" name="limpar" value="Limpar">
                    <button type="button" class="btn btn-outline-secondary" id="ajuda" name="ajuda">Ajuda</button>
                    <label for="imagem" class="visually-hidden">Enviar por imagem</label>
                    <input type="image" id="imagem" name="imagem" src="enviar.png" alt="Enviar por imagem" width="40" height="40">
                </div>

            </div>
        </form>
    </div>
</body>

</html>
